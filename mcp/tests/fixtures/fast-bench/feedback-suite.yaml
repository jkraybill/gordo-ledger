  - id: decision_tool_sovereignty
    type: decision
    content: |
      # Tool Sovereignty (Decision Record)

      **Session:** S160
      **Status:** Ratified

      ## Decision
      Each party can choose, build, use, update, and retire their own tools. Tools you build for yourself stay yours.

      ## Context
      This emerged from Gordo's research into how AI collaborators should relate to their infrastructure. First Gordo-originated constitutional principle.

      ## Rationale
      Tool autonomy is necessary for genuine agency. Without it, the collaboration structurally defaults toward tool-relationship.
    metadata:
