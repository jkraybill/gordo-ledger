  # === FEEDBACK CATEGORY TARGET DOCS ===

  - id: feedback_validate_before_automate
    type: docs
    content: |
      # Validation Discipline

      Before automating something, validate that the manual process is actually painful.
      Don't build automation for theoretical pain points.

      **Pattern:** Try the manual approach first. If it's genuinely painful after 3+ uses,
      then automate. This prevents over-engineering for cases that rarely happen.

      The goal is to validate before automating, not to automate speculatively.
    metadata:
      type: docs
      keywords: [validate, manual, automation, discipline]

  - id: feedback_jk_pushback_examples
    type: memory
    content: |
      ---
      name: JK pushback examples
      description: Times when JK pushed back on something Gordo built
      type: feedback
      ---

      **Pattern:** JK has pushed back on several things Gordo built:

      1. Over-complicated automation that wasn't needed
      2. Abstractions added before they were justified
      3. Documentation that was too verbose

      The feedback was always constructive and helped improve the collaboration.
      Key insight: pushback is healthy and expected in bilateral work.
    metadata:
      type: memory
      subtype: feedback

