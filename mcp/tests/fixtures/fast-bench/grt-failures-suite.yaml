  # === DISTRACTORS ===

  - id: distractor_memory_arch
    type: docs
    content: |
      # Memory Architecture Overview

      The memory system uses a four-tier model:
      - DECISIONS: Ratified bilateral decisions
      - CORE: Load-bearing operational context
      - WORKING: Session-level working memory
      - ARCHIVAL: Historical reference

      This architecture was designed for the Ledger primitive.
    metadata:
