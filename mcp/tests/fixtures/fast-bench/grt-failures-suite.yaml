  - id: distractor_benchmark_design
    type: docs
    content: |
      # Benchmark Design Principles

      The GRT benchmark tests retrieval quality across categories:
      - Decision retrieval
      - Session retrieval
      - Feedback retrieval
      - Temporal queries

      Each category targets specific retrieval capabilities.
    metadata:
